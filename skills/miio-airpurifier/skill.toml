[skill]
id = "miio-airpurifier"
name = "Xiaomi Air Purifier"
version = "0.1.0"
mode = "device"
description = "Long-running device Skill for Xiaomi Air Purifier via python-miio (with demo_mode for hardware-free testing)"

[runtime]
type = "python-uv"
python = ">=3.11"
entrypoint = ["python", "src/main.py"]
heartbeat_interval_secs = 30
invoke_timeout_secs = 15
restart_policy = "exponential"

[config.host]
type = "string"
required = false
default = "127.0.0.1"
description = "Device LAN IP address (unused when demo_mode = true)"

[config.poll_interval_secs]
type = "integer"
required = false
default = 10
min = 1
max = 300
description = "Status polling interval in seconds"

[config.area_id]
type = "string"
required = false
default = "living_room"
description = "Area ID assigned to discovered entities"

[config.demo_mode]
type = "boolean"
required = false
default = false
description = "Simulate a virtual air purifier locally without physical Xiaomi hardware"

[secrets.miio_token]
required = false
description = "32-character hex miio device token (required when demo_mode = false)"
